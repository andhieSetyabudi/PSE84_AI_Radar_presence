acronym_map:
  afe:
    - Audio Front-End
    - Analog Front-End
  asf:
    - Alternative Serial Interface to securely load and execute target code directly over an alternate serial connection during device provisioning or early booting stages — NOT Atmel Software Framework
  ccm:
    - Cloud Connectivity Manager — NOT Counter with CBC-MAC
  cts:
    - Current Time Service — NOT Clear To Send
  ess:
    - Environmental Sensing Service — NOT Extended Service Set
  hppass:
    - High-Performance Programmable Analog Sub-System
  lpa:
    - Low Power Assistant
  lppass:
    - Low-Power Autonomous Analog Sub-System
  mfs:
    - Multi-Frequency Scan — CAPSENSE noise-rejection mode
  mpc:
    - Memory Protection Controller
  msc:
    - Multi Sense Converter (CAPSENSE parts)
    - Mass Storage Class (USB parts)
  mtbml:
    - ModusToolbox Machine Learning
  otp:
    - One-Time Programmable memory — NOT One-Time Password
  pdl:
    - Peripheral Driver Library — the low-level ModusToolbox driver layer
  rlad:
    - Run-Length Adaptive Dithering — fixed-function decompression block in the GPU pipeline, not a software codec
  scb:
    - Serial Communication Block — configurable UART/SPI/I2C peripheral
  smif:
    - Serial Memory Interface — external flash/PSRAM controller
  srf:
    - Secure Request Framework
  stl:
    - Safety Test Library — NOT the C++ Standard Template Library
  svc:
    - Staged Voice Control middleware — NOT the Arm Cortex-M SVC (Supervisor Call) instruction
  tcpwm:
    - Peripheral Block configurable as a Timer, Counter, PWM
  wcm:
    - Wi-Fi Connection Manager
